name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[visa,test]"

    - name: Run Protocol Checks
      run: |
        python host/tests/check_protocol.py
        python sigrok/tests/check_protocol.py

    - name: Run Host Client & Tool Tests
      run: |
        python host/tests/test_client.py
        python host/tests/test_cal.py
        python host/tests/test_shots.py
        python host/tests/test_roll_host.py
        python host/tests/test_rigol_emu.py
        python host/tests/test_pyvisa.py

  firmware-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install ARM Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

    - name: Build Firmware Extension
      run: |
        make -C firmware_ext
