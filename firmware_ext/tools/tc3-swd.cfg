# tc3-swd.cfg -- generic SWD attach for the FNIRSI DSO-TC3 (N32G45x, Cortex-M4).
#
# Used only for memory reads/backups (dump_image); needs no chip-specific
# flash driver. If the DAP ID mismatches, OpenOCD prints the real one --
# update _CPUTAPID accordingly (Cortex-M4 SW-DP is normally 0x2ba01477).
#
# Usage:
#   openocd -f firmware_ext/tools/tc3-swd.cfg \
#     -c "init; targets; mdw 0x08000000 4; shutdown"                # RDP test
#   openocd -f firmware_ext/tools/tc3-swd.cfg \
#     -c "init; dump_image /tmp/opencode/swd-backup.bin 0x08000000 0x80000; shutdown"
#
# Connect ST-Link v2: SWDIO, SWCLK, GND, VREF->board 3.3V, NRST if broken out.
# J4 (6-pin unpopulated header, silkscreen TC3-V2.0-0912, west of U1):
# expected signals 3V3 / SWDIO / SWCLK / GND / NRST (+UART) -- order not
# silkscreened; identify GND+3V3 by multimeter, SWDIO/SWCLK by trial
# (swapping them is harmless).

adapter driver hla
hla_layout stlink
hla_vid_pid 0x0483 0x3748
transport select hla_swd
adapter speed 1000

# override the default st-link speed if needed:
# adapter speed 100

set _CHIPNAME tc3
set _CPUTAPID 0x2ba01477

source [find target/swj-dp.tcl]
# no -expected-id: accept whatever DAP the chip reports (first attach also
# answers the "which DAP ID does N32G45x use" question empirically)
swj_newdap $_CHIPNAME cpu -irlen 0
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap
